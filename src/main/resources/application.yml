spring:
  application:
    name: ARVELLO
  datasource:
    url: ${DB_URL:jdbc:mysql://47.111.172.151:3306/hqc_plt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:chen0226}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:500MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:500MB}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

wechat:
  app-id: ${WECHAT_APP_ID:wx37520a19c8dba100}
  app-secret: ${WECHAT_APP_SECRET:4ccada04ae920f42b7e27e3447ccfb2e}
  api-base-url: https://api.weixin.qq.com
  mini-program-code-env-version: ${WECHAT_MINI_PROGRAM_CODE_ENV_VERSION:release}

app:
  session-ttl: ${SESSION_TTL:30d}
  session-touch-interval: 5m
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    session-ttl: ${ADMIN_SESSION_TTL:12h}
  media:
    root: ${MEDIA_ROOT:${user.dir}/data/media}

logging:
  level:
    root: INFO
    com.qinglian.fitness: INFO

mybatis:
  mapper-locations: classpath:/mappers/*.xml
