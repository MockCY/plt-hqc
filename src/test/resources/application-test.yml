spring:
  datasource:
    url: jdbc:h2:mem:fitness;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

wechat:
  app-id: test-app-id
  app-secret: test-app-secret
  api-base-url: https://api.weixin.qq.com

app:
  session-ttl: 30d
  session-touch-interval: 5m
