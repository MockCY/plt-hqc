spring:
  config:
    import: optional:file:.env.test[.properties]
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/hqc_plt_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  sql:
    init:
      mode: always
      continue-on-error: false
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

wechat:
  app-id: test-app-id
  app-secret: test-app-secret
  api-base-url: https://api.weixin.qq.com

app:
  session-ttl: 30d
  session-touch-interval: 5m
  admin:
    username: admin
    password: admin-test-password
    session-ttl: 12h
