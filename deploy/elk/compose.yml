name: arvello-elk

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in elk/.env}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 2g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS -u "elastic:$$ELASTIC_PASSWORD" "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      interval: 10s
      timeout: 10s
      retries: 30
    logging: *logging

  setup:
    # Reuse Elasticsearch's bundled curl without a separate Docker Hub pull.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in elk/.env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in elk/.env}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?Set LOGSTASH_PASSWORD in elk/.env}
    entrypoint: [/bin/sh, /setup/setup.sh]
    volumes:
      - ./setup:/setup:ro
    logging: *logging

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.4
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?Set LOGSTASH_PASSWORD in elk/.env}
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - logstash-data:/usr/share/logstash/data
    logging: *logging

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.4
    user: root
    restart: unless-stopped
    command: [filebeat, -e, --strict.perms=false]
    depends_on:
      logstash:
        condition: service_started
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - backend-logs:/var/log/arvello:ro
      - filebeat-data:/usr/share/filebeat/data
    logging: *logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.4
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in elk/.env}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in elk/.env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in elk/.env}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in elk/.env}
      TELEMETRY_ENABLED: "false"
    mem_limit: 1g
    ports:
      - "127.0.0.1:5601:5601"
    logging: *logging

volumes:
  backend-logs:
    external: true
    name: arvello-backend-logs
  elasticsearch-data:
  logstash-data:
  filebeat-data:

networks:
  default:
    internal: true
