services:
  arvello-backend:
    container_name: arvello-backend
    image: arvello-backend:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      MEDIA_ROOT: /data/arvello/media
    volumes:
      - ${MEDIA_HOST_PATH:-./data/media}:/data/arvello/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"

  arvello-admin:
    container_name: arvello-admin
    image: arvello-admin:latest
    build:
      context: ../../admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - arvello-backend
    ports:
      - "127.0.0.1:8081:80"
