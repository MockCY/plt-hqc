name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t plt-hgc:latest .

      - name: Save Docker image
        run: |
          docker save plt-hgc:latest -o plt-hgc.tar
          chmod 644 plt-hgc.tar
          ls -lh plt-hgc.tar

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /home/admin/deploy

      - name: Upload Docker image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "plt-hgc.tar"
          target: "/home/admin/deploy"

      - name: Deploy to Alibaba Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/admin/deploy

            docker load -i plt-hgc.tar

            docker rm -f plt-hgc 2>/dev/null || true

            docker run -d \
              --name plt-hgc \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              plt-hgc:latest

            rm -f plt-hgc.tar

            docker image prune -f