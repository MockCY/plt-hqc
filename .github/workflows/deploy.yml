name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Alibaba Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /home/admin

            if [ ! -d "plt-hgc/.git" ]; then
              git clone https://github.com/MockCY/plt-hgc.git
            fi

            cd plt-hgc

            git fetch origin
            git reset --hard origin/main

            docker build -t plt-hgc:latest .

            docker rm -f plt-hgc 2>/dev/null || true

            docker run -d \
              --name plt-hgc \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              plt-hgc:latest

            docker image prune -f