name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t arvello-backend:latest .

      - name: Save Docker image
        run: |
          docker save arvello-backend:latest -o arvello-backend.tar
          chmod 644 arvello-backend.tar
          ls -lh arvello-backend.tar

      - name: Create deployment environment file
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -eu

          if [ -z "$DEPLOY_ENV" ]; then
            echo "::error::Repository secret DEPLOY_ENV is not configured"
            exit 1
          fi

          printf '%s\n' "$DEPLOY_ENV" > deploy/.env
          # scp-action runs in a container and must be able to read this file.
          # The remote deployment step restores owner-only permissions.
          chmod 644 deploy/.env

          for name in DB_URL DB_USERNAME DB_PASSWORD WECHAT_APP_ID WECHAT_APP_SECRET ADMIN_USERNAME ADMIN_PASSWORD; do
            if ! grep -Eq "^${name}=.+" deploy/.env; then
              echo "::error::DEPLOY_ENV is missing a non-empty ${name}"
              exit 1
            fi
          done

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /home/admin/deploy
            mkdir -p /home/admin/deploy/data/media

      - name: Upload Docker image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "arvello-backend.tar"
          target: "/home/admin/deploy"

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/.env"
          target: "/home/admin/deploy"
          strip_components: 1

      - name: Deploy to Alibaba Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/admin/deploy

            test -f .env || { echo "Missing /home/admin/deploy/.env"; exit 1; }
            test -f docker-compose.yml || { echo "Missing docker-compose.yml"; exit 1; }
            chmod 600 .env

            docker load -i arvello-backend.tar

            docker rm -f plt-hgc 2>/dev/null || true
            docker compose --env-file .env up -d --no-build --remove-orphans arvello-backend

            rm -f arvello-backend.tar

            docker image prune -f

            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
                docker compose ps
                exit 0
              fi
              sleep 5
            done

            docker compose logs --tail=200 arvello-backend
            exit 1
